name: Discord Notifications
description: Sends Discord notifications through a webhook.
inputs:
  webhook_id:
    description: Discord webhook ID.
    required: false
  webhook_token:
    description: Discord webhook token.
    required: false
  webhook_id_token:
    description: Discord webhook ID and token in `id/token` format.
    required: false
  title:
    description: Message title.
    required: false
    default: Release VERSION
  color:
    description: Embed color as a decimal integer.
    required: false
    default: "3447003"
  description:
    description: Embed description.
    required: false
  url:
    description: URL linked from the message title.
    required: false
  username:
    description: Username shown on the message.
    required: false
  avatar_url:
    description: Avatar URL shown on the message.
    required: false
  author:
    description: Embed author name.
    required: false
  author_url:
    description: URL linked from the embed author name.
    required: false
  author_icon_url:
    description: Icon URL shown next to the embed author name.
    required: false
  message:
    description: Plain-text message content.
    required: false
  release:
    description: Use GitHub release details in the embed.
    required: false
    default: "false"
  commits:
    description: Use push-event commit details in the embed.
    required: false
    default: "false"
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  color: orange
  icon: align-justify
